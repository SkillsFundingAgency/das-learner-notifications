parameters:
  SolutionBaseName:
  BuildConfiguration:

jobs:
- job: CodeBuild
  pool:
    name: DAS - Continuous Integration Agents
    workspace:
      clean: all
  variables:
  - group: BUILD Management Resources
  steps:
  - checkout: self
    fetchDepth: 0
    
  - template: azure-pipelines-templates/build/step/gitversion.yml@das-platform-building-blocks

  - template: azure-pipelines-templates/build/step/app-build.yml@das-platform-building-blocks

  - task: DotNetCoreCLI@2
    displayName: Publish - dotnet publish ${{ parameters.SolutionBaseName }}.Api
    inputs:
      command: publish
      publishWebProjects: false
      projects: src/${{ parameters.SolutionBaseName }}.Api/${{ parameters.SolutionBaseName }}.Api.csproj
      arguments: -o $(build.artifactstagingdirectory)/publish -c ${{ parameters.BuildConfiguration }} --no-build
      modifyOutputPath: true
      zipAfterPublish: true

  - task: DotNetCoreCLI@2
    displayName: Publish - dotnet publish ${{ parameters.SolutionBaseName }}.LearnerNotificationService
    inputs:
      command: publish
      publishWebProjects: false
      projects: src/${{ parameters.SolutionBaseName }}.LearnerNotificationService/${{ parameters.SolutionBaseName }}.LearnerNotificationService.csproj
      arguments: -o $(build.artifactstagingdirectory)/publish -c ${{ parameters.BuildConfiguration }} --no-build
      modifyOutputPath: true
      zipAfterPublish: true

  - task: DotNetCoreCLI@2
    displayName: Build - dotnet build ${{ parameters.SolutionBaseName }}.Api.ReqnrollTests
    inputs:
      command: build
      projects: src/${{ parameters.SolutionBaseName }}.Api.ReqnrollTests/${{ parameters.SolutionBaseName }}.Api.ReqnrollTests.csproj
      arguments: -c ${{ parameters.BuildConfiguration }} --no-restore

  - task: CopyFiles@2
    displayName: Copy acceptance test binaries to publish
    inputs:
      SourceFolder: src/${{ parameters.SolutionBaseName }}.Api.ReqnrollTests/bin/${{ parameters.BuildConfiguration }}/net10.0
      Contents: '**'
      TargetFolder: $(build.artifactstagingdirectory)/publish/acceptance-tests
      OverWrite: true

  - task: CopyFiles@2
    displayName: Copy Files to $(build.artifactstagingdirectory)/publish
    inputs:
      Contents: |
        azure/**
      TargetFolder: $(build.artifactstagingdirectory)/publish
      OverWrite: true

  - task: PublishPipelineArtifact@1
    displayName: Publish Build Artifact
    inputs:
      targetPath: $(build.artifactstagingdirectory)/publish
      artifactName: ${{ parameters.SolutionBaseName }}

